<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Moon Arc Creations Employee Monitoring Portal">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Moon Attendance">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Moon Attendance</title>
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA Install Prompt Styling -->
  <style>
    #ios-pwa-prompt {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      width: calc(100% - 32px);
      max-width: 420px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 24px;
      padding: 20px 24px;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
      color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 100000;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s;
      opacity: 0;
      pointer-events: none;
      box-sizing: border-box;
    }
    #ios-pwa-prompt.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .pwa-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .pwa-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pwa-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #F1F5F9;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
    }
    .pwa-title {
      font-weight: 700;
      font-size: 16px;
      margin: 0;
      letter-spacing: 0.5px;
      color: #0F172A;
    }
    .pwa-subtitle {
      font-size: 12px;
      color: #64748B;
      margin: 2px 0 0 0;
    }
    .pwa-close-btn {
      border: none;
      background: rgba(0, 0, 0, 0.04);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      color: #64748B;
      transition: background 0.2s;
    }
    .pwa-close-btn:hover {
      background: rgba(0, 0, 0, 0.08);
    }
    .pwa-body {
      font-size: 14px;
      line-height: 1.5;
      color: #334155;
      margin-bottom: 16px;
    }
    .pwa-steps {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .pwa-step {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.02);
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.03);
    }
    .pwa-step-number {
      width: 22px;
      height: 22px;
      background: #000000;
      color: #FFFFFF;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      flex-shrink: 0;
    }
    .pwa-step-text {
      font-size: 13px;
      color: #0F172A;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      
      var isStandalone = window.navigator.standalone || 
                         window.matchMedia('(display-mode: standalone)').matches;
      
      var isDismissed = localStorage.getItem('ios-pwa-prompt-dismissed');

      if (isIOS && !isStandalone && !isDismissed) {
        setTimeout(function() {
          var prompt = document.getElementById('ios-pwa-prompt');
          if (prompt) {
            prompt.classList.add('show');
          }
        }, 3000);
      }
    });

    function dismissIOSPrompt() {
      var prompt = document.getElementById('ios-pwa-prompt');
      if (prompt) {
        prompt.classList.remove('show');
      }
      localStorage.setItem('ios-pwa-prompt-dismissed', 'true');
    }
  </script>
</head>
<body>
  <!-- iOS PWA Install Prompt -->
  <div id="ios-pwa-prompt">
    <div class="pwa-header">
      <div class="pwa-title-group">
        <div class="pwa-icon">
          <img src="favicon.png" alt="Moon Attendance Icon" style="width: 24px; height: 24px;">
        </div>
        <div>
          <h3 class="pwa-title">Moon Attendance</h3>
          <p class="pwa-subtitle">Moon Arc Creations</p>
        </div>
      </div>
      <button class="pwa-close-btn" onclick="dismissIOSPrompt()">×</button>
    </div>
    <div class="pwa-body">
      Install Moon Attendance on your iPhone or iPad for a fullscreen, native app experience.
    </div>
    <ul class="pwa-steps">
      <li class="pwa-step">
        <span class="pwa-step-number">1</span>
        <span class="pwa-step-text">
          Tap the Share button 
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #007AFF; margin: 0 4px; vertical-align: middle; display: inline-block;">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
            <polyline points="16 6 12 2 8 6"></polyline>
            <line x1="12" y1="2" x2="12" y2="15"></line>
          </svg>
          in the Safari toolbar.
        </span>
      </li>
      <li class="pwa-step">
        <span class="pwa-step-number">2</span>
        <span class="pwa-step-text">
          Scroll down and choose <strong>Add to Home Screen</strong>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #0F172A; margin: 0 4px; vertical-align: middle; display: inline-block;">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          .
        </span>
      </li>
    </ul>
  </div>

  <!-- Required by supabase_flutter's passkeys dependency -->
  <script src="passkeys_bundle.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
